// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply plugin: 'maven-publish'
buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        //classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.7.3'
        //classpath 'com.github.dcendents:android-maven-gradle-plugin:2.0'
        //classpath 'com.vanniktech:gradle-maven-publish-plugin:0.12.0'


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        jcenter()
        // Nexus GII IP: 10.113.36.13:8443
        // Nexus GII IP: 10.113.36.13:8083 (use insecure protocols)
        maven {
            url "http://10.113.36.13:8083/nexus/repository/releases/"
            allowInsecureProtocol = true
        }
        maven {
            url "http://10.113.36.13:8083/nexus/repository/snapshots/"
            allowInsecureProtocol = true
        }
        maven {
            url "https://maven.google.com"
        }
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
